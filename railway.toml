# railway.toml — NeuralWire build configuration
# Docs: docs.railway.com/reference/config-as-code
#
# The only thing this file sets is the builder. Start commands, cron
# schedules and env vars all live in each service's Railway dashboard
# settings, not here — the map below is documentation of what is
# configured there, so keep it in sync by hand.
#
# ── Services in the Railway project (all deploy from this repo) ───────────────
#
#  web            →  uvicorn api:app --host 0.0.0.0 --port $PORT   (see Procfile)
#                    Always on. Serves the FastAPI read API to the
#                    Next.js frontend on Vercel.
#                    Healthcheck path /health, timeout 60 s (dashboard,
#                    web only: the workers serve no HTTP, so it must NOT
#                    go in this shared file or their deploys would fail).
#
#  neuralwire     →  python scheduler.py
#                    Always on. APScheduler process that owns every
#                    periodic job and runs each one as a subprocess.
#                    Schedules live in scheduler.py, NOT in Railway cron:
#                      run_fetch.py             0 */2 * * *    every 2 h
#                      run_earnings.py          0 6 * * *      06:00 UTC daily
#                      run_events.py            0 */4 * * *    every 4 h
#                      run_artefacts.py         0 5 * * *      05:00 UTC daily
#                      run_sync_daily_prices.py 0 22 * * 1-5   after NYSE close
#                      run_sync_intraday.py     15 21 * * 1-5  15 min after close
#
#  analysis-loop  →  python run_analysis.py
#                    Always on, and deliberately a SEPARATE service from
#                    neuralwire: the analysis loop is the component that has
#                    actually crashed, and isolating it keeps the scheduled
#                    jobs running when it does. It paces itself internally
#                    (small batch, sleeps only when the queue is drained) —
#                    do not put it back on a Railway/APScheduler cron. As a
#                    30-min cron it outlived its own schedule and every
#                    re-fire was dropped with "maximum number of running
#                    instances reached".
#
#  Postgres       →  Railway Postgres plugin + postgres-volume
#                    Grow the volume in the volume's Settings tab; billing
#                    is on data stored, not on provisioned size.
#
# Every app service needs the same env vars: DATABASE_URL, OPENROUTER_KEY,
# XAI_API_KEY, ALPHA_VANTAGE_API_KEY, ALPACA_KEY, ALPACA_SECRET.

[build]
builder = "nixpacks"

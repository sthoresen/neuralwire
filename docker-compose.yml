version: "3.8"

services:
  db:
    image: postgres:16
    container_name: neuralwire-pg
    environment:
      POSTGRES_DB: stocknews
      POSTGRES_USER: stocknews
      POSTGRES_PASSWORD: stocknews
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./neuralwire_dump.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocknews -d stocknews"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:

# Tool configuration only — NeuralWire is an application, not an installable package.

[tool.ruff]
target-version = "py311"
line-length = 100
# python_backend modules import each other by bare name (import database),
# so treat both directories as first-party when sorting imports.
src = [".", "python_backend"]
extend-exclude = ["_archive", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs (mutable defaults, bare except, ...)
    "UP",  # pyupgrade: modern syntax for the target Python version
]
ignore = [
    "E501",  # line length — the formatter handles code; long prompt strings are fine
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "python_backend"]
